  <style>:root {
  --ink: #17191c;
  --ink-soft: #666b73;
  --blue: #0052d9;
  --blue-deep: #003d99;
  --blue-pale: #e8f3ff;
  --paper: #f8f9fa;
  --surface: #ffffff;
  --line: #cfe4ff;
  --line-soft: #e8edf3;
  --shadow: 0 8px 24px rgba(31, 35, 41, .08);
  font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }

.skip-link { position: fixed; left: 1rem; top: -5rem; z-index: 100; background: var(--ink); color: white; padding: .75rem 1rem; border-radius: 999px; }
.skip-link:focus { top: 1rem; }

.topbar {
  width: min(760px, 100%);
  margin: 0 auto;
  min-height: 118px;
  padding: max(1.4rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) 1.25rem max(1.25rem, env(safe-area-inset-left));
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  background: var(--surface);
}
.top-title { min-width: 0; }
.top-kicker { display: block; margin-bottom: .4rem; color: var(--blue-deep); font-size: .75rem; font-weight: 800; letter-spacing: .24em; }
.top-title strong { display: block; font-size: clamp(1.9rem, 9vw, 2.45rem); font-weight: 800; line-height: 1; letter-spacing: -.04em; }
.top-actions { flex: 0 0 auto; display: flex; align-items: center; gap: .6rem; }
.top-meta { text-align: right; }
.top-meta b { display: block; font-size: .92rem; font-weight: 700; }
.top-meta small { display: block; margin-top: .2rem; color: var(--ink-soft); font-size: .68rem; letter-spacing: .04em; }
.icon-button {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--blue);
  box-shadow: 0 4px 14px rgba(31, 35, 41, .08);
}
.icon-button svg { width: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.date-ribbon {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, .96);
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  backdrop-filter: blur(16px);
}
.date-scroll {
  width: min(760px, 100%);
  margin: 0 auto;
  display: flex;
  gap: .65rem;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-width: none;
  padding: .85rem max(1.1rem, env(safe-area-inset-right)) .9rem max(1.1rem, env(safe-area-inset-left));
}
.date-scroll::-webkit-scrollbar { display: none; }
.date-tab {
  flex: 0 0 auto;
  min-width: 112px;
  min-height: 62px;
  border: 1px solid transparent;
  border-radius: 22px;
  padding: .62rem .9rem .58rem;
  background: #f2f4f7;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.date-tab b { display: block; white-space: nowrap; font-size: .95rem; font-weight: 800; letter-spacing: .01em; }
.date-tab .date-label { display: flex; align-items: center; gap: .38rem; margin-top: .22rem; color: var(--ink-soft); font-size: .72rem; }
.date-tab .date-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px rgba(0, 82, 217, .1); }
.date-tab[aria-selected="true"] {
  border: 2px solid var(--blue-deep);
  padding: calc(.62rem - 1px) calc(.9rem - 1px) calc(.58rem - 1px);
  background: var(--blue);
  color: white;
  box-shadow: 0 4px 0 rgba(0, 61, 153, .22);
  transform: translateY(-2px);
}
.date-tab[aria-selected="true"] .date-label { color: rgba(255, 255, 255, .82); }
.date-tab[aria-selected="true"] .date-label::before { background: white; box-shadow: 0 0 0 3px rgba(255, 255, 255, .18); }
.date-tab:focus-visible { outline: 3px solid rgba(0, 82, 217, .25); outline-offset: 3px; }

.page-shell { width: min(720px, 100%); margin: 0 auto; padding: 2.2rem 1.25rem calc(5rem + env(safe-area-inset-bottom)); }
.day-heading {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 1.2rem;
  align-items: start;
  margin: 0 0 2.15rem;
}
.day-date { padding-top: .15rem; }
.day-date strong { display: block; font-size: 1.42rem; font-weight: 850; line-height: 1; letter-spacing: -.04em; }
.day-date span { display: block; margin-top: .45rem; color: var(--ink-soft); font-size: .82rem; }
.day-copy { min-width: 0; }
.day-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: .6rem; }
.day-heading h1 { margin: 0; font-size: clamp(1.42rem, 6vw, 1.95rem); font-weight: 800; line-height: 1.22; letter-spacing: -.03em; }
.day-heading p { margin: .45rem 0 0; color: var(--ink-soft); font-size: .88rem; line-height: 1.55; }
.weather-note { flex: 0 0 auto; padding: .32rem .58rem; color: var(--blue-deep); background: var(--blue-pale); border-radius: 999px; font-size: .68rem; font-weight: 750; white-space: nowrap; }

.timeline { position: relative; margin-left: 98px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 16px; width: 1px; background: #dce2e8; }
.timeline-card { position: relative; margin: 0 0 2.25rem; padding-left: 2.1rem; }
.timeline-dot {
  position: absolute;
  left: 0;
  top: .33rem;
  width: 15px;
  height: 15px;
  border: 3px solid var(--blue);
  border-radius: 50%;
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--paper);
}
.place-card { min-width: 0; }
.place-main { min-width: 0; }
.event-line { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-bottom: .42rem; }
.timeline-time { color: #4d525a; font-size: .84rem; font-weight: 850; letter-spacing: .04em; }
.place-meta { display: inline-flex; align-items: center; gap: .3rem; padding: .23rem .5rem; border-radius: 999px; background: var(--blue-pale); color: var(--blue-deep); font-size: .68rem; font-weight: 750; }
.mode-icon { display: inline; font-size: .72rem; line-height: 1; }
.place-main h2 { margin: 0 0 .35rem; font-size: 1.28rem; font-weight: 800; line-height: 1.34; letter-spacing: -.02em; overflow-wrap: anywhere; }
.transit { margin: 0; color: var(--ink-soft); font-size: .9rem; line-height: 1.58; }

.details-panel { margin-top: .8rem; padding: .62rem 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.detail-row { display: grid; grid-template-columns: 4.15rem minmax(0, 1fr); gap: .65rem; padding: .38rem 0; font-size: .82rem; line-height: 1.52; }
.detail-row b { color: var(--blue-deep); font-size: .74rem; font-weight: 800; letter-spacing: .01em; }
.detail-row span { color: #555b63; }
.card-actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .82rem; }
.map-button, .booking-button, .resource-button {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  border: 0;
  border-radius: 999px;
  padding: .62rem 1rem;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
  font-size: .8rem;
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
}
.map-button::before { content: "◎"; color: var(--blue); font-size: .95rem; }
.booking-button { background: var(--blue); color: white; }
.booking-button::before { content: "✓"; font-size: .82rem; }
.resource-button { border: 1px solid var(--line); color: var(--blue-deep); }
.resource-button::before { content: "↗"; color: var(--blue); font-size: .86rem; }

.image-disclosure, .detail-disclosure { margin-top: .82rem; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.image-disclosure summary, .detail-disclosure summary {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .8rem;
  padding: .62rem 0;
  color: var(--blue-deep);
  cursor: pointer;
  list-style: none;
  font-size: .82rem;
  font-weight: 800;
}
.image-disclosure summary::-webkit-details-marker, .detail-disclosure summary::-webkit-details-marker { display: none; }
.image-disclosure[open] .summary-toggle, .detail-disclosure[open] .summary-toggle { transform: rotate(225deg) translate(-2px, -2px); }
.disclosure-detail-rows { padding: .1rem 0 .72rem; }
.disclosure-image-link {
  width: min(100%, 360px);
  display: block;
  overflow: hidden;
  margin: .15rem auto .9rem;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: white;
  color: var(--blue-deep);
  box-shadow: 0 6px 20px rgba(31, 35, 41, .07);
  text-decoration: none;
}
.disclosure-image-link img { display: block; width: 100%; height: auto; }
.disclosure-image-link span { display: block; padding: .55rem .6rem; border-top: 1px solid var(--line); font-size: .72rem; font-weight: 750; text-align: center; }
.disclosure-links { display: flex; justify-content: center; padding: 0 0 .9rem; }
.disclosure-resource-link { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 999px; padding: .62rem 1rem; background: var(--blue); color: white; font-size: .8rem; font-weight: 800; text-decoration: none; }

.optional-timeline-card { margin-bottom: 2.25rem; }
.optional-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: 0 5px 18px rgba(31, 35, 41, .06);
}
.optional-card summary {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  padding: .9rem 1rem;
  cursor: pointer;
  list-style: none;
}
.optional-card summary::-webkit-details-marker { display: none; }
.optional-card summary h2 { margin: 0; font-size: 1.08rem; }
.summary-toggle {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-right: 2px solid var(--blue);
  border-bottom: 2px solid var(--blue);
  transform: rotate(45deg) translateY(-2px);
  transition: transform .16s ease;
}
.optional-card[open] .summary-toggle { transform: rotate(225deg) translate(-2px, -2px); }
.optional-card-content { padding: 0 1rem 1rem; border-top: 1px solid var(--line-soft); }
.optional-card-content > .transit { padding-top: .85rem; }
.spot-link-list { margin-top: .7rem; }
.spot-link-row {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .8rem;
  border-top: 1px solid var(--line-soft);
  padding: .6rem 0;
}
.spot-link-row strong { min-width: 0; font-size: .86rem; line-height: 1.4; }
.spot-link-actions { display: flex; flex: 0 0 auto; gap: .45rem; }
.spot-icon-button {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--blue);
  text-decoration: none;
  box-shadow: 0 3px 10px rgba(31, 35, 41, .06);
}
.spot-icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.xhs-spot-button { border-color: #ffd5d9; background: #fff5f6; color: #d92835; font-size: .72rem; font-weight: 900; }
.spot-icon-button:focus-visible, .optional-card summary:focus-visible, .image-disclosure summary:focus-visible, .disclosure-image-link:focus-visible, .disclosure-resource-link:focus-visible { outline: 3px solid rgba(0, 82, 217, .24); outline-offset: 2px; }

.shopping-guide { margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--line-soft); }
.guide-image-block { position: relative; }
.guide-image-link { display: block; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 6px 20px rgba(31, 35, 41, .07); }
.guide-image-link img { display: block; width: 100%; height: auto; }
.guide-xhs-button { position: absolute; right: .65rem; bottom: .65rem; border-color: white; box-shadow: 0 4px 14px rgba(31, 35, 41, .18); }
.guide-shop { margin-top: .8rem; padding: .8rem .85rem; border: 1px solid var(--line-soft); border-radius: 14px; background: #fbfcfe; }
.guide-shop-heading { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
.guide-shop-heading h3 { margin: 0; font-size: .94rem; line-height: 1.35; }
.guide-shop-notes { margin-top: .45rem; }
.guide-shop-notes .detail-row { grid-template-columns: 4.6rem minmax(0, 1fr); padding: .3rem 0; }

.ticket-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; margin-top: .85rem; }
.ticket-gallery a { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--blue-deep); box-shadow: 0 6px 20px rgba(31, 35, 41, .06); text-decoration: none; }
.ticket-gallery img { display: block; width: 100%; aspect-ratio: .48; object-fit: contain; background: white; }
.ticket-gallery span { display: block; padding: .55rem .4rem; border-top: 1px solid var(--line); font-size: .72rem; font-weight: 700; text-align: center; }

.day-note { margin: .5rem 0 1.5rem 98px; border-left: 3px solid var(--blue); padding: .2rem 0 .2rem .9rem; font-size: .86rem; line-height: 1.65; color: var(--ink-soft); }
.food-backups { margin: 2.6rem 0 0 98px; }
.food-backups-heading { margin-bottom: .9rem; }
.section-kicker { display: block; margin-bottom: .3rem; color: var(--blue-deep); font-size: .66rem; font-weight: 850; letter-spacing: .18em; }
.food-backups-heading h2 { margin: 0; font-size: 1.22rem; line-height: 1.3; letter-spacing: -.02em; }
.food-area { overflow: hidden; margin-top: .72rem; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 5px 18px rgba(31, 35, 41, .06); }
.food-area > summary { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .82rem 1rem; cursor: pointer; list-style: none; }
.food-area > summary::-webkit-details-marker { display: none; }
.food-area > summary > span:first-child { min-width: 0; display: flex; align-items: baseline; gap: .5rem; }
.food-area > summary strong { font-size: .96rem; }
.food-area > summary small { color: var(--ink-soft); font-size: .7rem; }
.food-area[open] > summary .summary-toggle { transform: rotate(225deg) translate(-2px, -2px); }
.food-area-content { border-top: 1px solid var(--line-soft); padding: .85rem 1rem 1rem; }
.food-area-note { margin: 0 0 .45rem; color: var(--ink-soft); font-size: .78rem; line-height: 1.55; }
.food-option { padding: .82rem 0; border-top: 1px solid var(--line-soft); }
.food-option:first-child { border-top: 0; }
.food-option-heading { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
.food-option h3 { min-width: 0; margin: 0; font-size: .9rem; line-height: 1.45; }
.food-option p { margin: .38rem 0 0; color: #555b63; font-size: .8rem; line-height: 1.58; }
.food-option .spot-icon-button { width: 32px; height: 32px; flex: 0 0 auto; }
.food-option .spot-icon-button svg { width: 15px; height: 15px; }
.utility-strip { display: flex; flex-wrap: wrap; gap: .55rem; margin: 1.8rem 0 0 98px; padding-top: 1rem; border-top: 1px solid var(--line-soft); }
.text-button { min-height: 42px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: .62rem .9rem; font: inherit; font-size: .79rem; font-weight: 700; text-decoration: none; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom)); z-index: 60; max-width: calc(100% - 2rem); transform: translate(-50%, 140%); transition: transform .25s ease; background: var(--ink); color: white; border-radius: 999px; padding: .72rem 1rem; box-shadow: var(--shadow); font-size: .84rem; }
.toast.show { transform: translate(-50%, 0); }
.empty-day { margin-left: 2rem; color: var(--ink-soft); }

@media (max-width: 560px) {
  .topbar { min-height: 108px; padding-inline: 1.15rem; }
  .top-title strong { font-size: 2rem; }
  .top-meta small { display: none; }
  .date-tab { min-width: 108px; }
  .page-shell { padding: 1.8rem 1.15rem calc(4.5rem + env(safe-area-inset-bottom)); }
  .day-heading { grid-template-columns: 76px minmax(0, 1fr); gap: .9rem; }
  .day-date strong { font-size: 1.24rem; }
  .day-title-row { display: block; }
  .weather-note { display: inline-flex; margin-top: .55rem; }
  .timeline { margin-left: 76px; }
  .timeline-card { padding-left: 1.8rem; }
  .day-note, .food-backups, .utility-strip { margin-left: 76px; }
}

@media (max-width: 390px) {
  .topbar { min-height: 102px; }
  .top-title strong { font-size: 1.82rem; }
  .top-kicker { font-size: .68rem; }
  .day-heading { grid-template-columns: 68px minmax(0, 1fr); }
  .timeline { margin-left: 68px; }
  .day-note, .food-backups, .utility-strip { margin-left: 68px; }
  .ticket-gallery { grid-template-columns: 1fr; }
  .detail-row { grid-template-columns: 3.8rem minmax(0, 1fr); gap: .5rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
  <a class="skip-link" href="#timeline">跳到当天行程</a>
  <header class="topbar">
    <div class="top-title" aria-label="东京与伊豆逐日行程">
      <span class="top-kicker">DAY BY DAY</span>
      <strong>逐日行程</strong>
    </div>
    <div class="top-actions">
      <div class="top-meta"><b>共7天</b><small>东京 · 伊豆</small></div>
      <button class="icon-button" id="installButton" type="button" hidden aria-label="安装到手机主屏幕" title="安装到手机主屏幕">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 15v4h14v-4"/></svg>
      </button>
    </div>
  </header>

  <nav class="date-ribbon" aria-label="选择日期">
    <div id="dateNav" class="date-scroll"></div>
  </nav>

  <main id="main" class="page-shell">
    <section class="day-heading" aria-live="polite">

  <script>const tripDays = window.tripDays;
const foodAlternatives = window.foodAlternatives || [];

const $ = (selector) => document.querySelector(selector);
const nav = $('#dateNav');
const timeline = $('#timeline');
function japanDayId() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  return `${parts.find(part => part.type === 'month').value}-${parts.find(part => part.type === 'day').value}`;
}
let activeDay = tripDays.some(day => day.id === japanDayId()) ? japanDayId() : tripDays[0].id;
let installPrompt;

function escapeHtml(value='') {
  return value.replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function mapLink(destination) {
  const p = new URLSearchParams({ api: '1', query: destination });
  return `https://www.google.com/maps/search/?${p}`;
}

function renderNav() {
  nav.innerHTML = tripDays.map((day, index) => `
    <button class="date-tab" type="button" role="tab" aria-selected="${day.id === activeDay}" data-day="${day.id}">
      <b>D${index + 1} · ${day.date}</b><span class="date-label">${day.label}</span>
    </button>`).join('');
}

function paddedDate(value) {
  return value.split('/').map(part => part.padStart(2, '0')).join('/');
}

function detailRows(rows=[]) {
  return rows.map(([label, text]) => `<div class="detail-row"><b>${escapeHtml(label)}</b><span>${escapeHtml(text)}</span></div>`).join('');
}

function ticketGallery(images=[]) {
  if (!images.length) return '';
  return `<div class="ticket-gallery" aria-label="SHIBUYA SKY 电子票">${images.map((src, index) => `
    <a href="${escapeHtml(src)}" target="_blank" rel="noopener" aria-label="放大查看电子票 ${index + 1}">
      <img src="${escapeHtml(src)}" alt="SHIBUYA SKY 电子票 ${index + 1}" loading="lazy">
      <span>电子票 ${index + 1} · 点击放大</span>
    </a>`).join('')}</div>`;
}

function imageDisclosure(image) {
  if (!image?.src) return '';
  const links = (image.links || []).map(link => `<a class="disclosure-resource-link" href="${escapeHtml(link.href)}" target="_blank" rel="noopener">${escapeHtml(link.label)}</a>`).join('');
  return `<details class="image-disclosure">
    <summary><span>${escapeHtml(image.title || '查看图片')}</span><span class="summary-toggle" aria-hidden="true"></span></summary>
    <a class="disclosure-image-link" href="${escapeHtml(image.src)}" target="_blank" rel="noopener" aria-label="放大查看${escapeHtml(image.title || '图片')}">
      <img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.alt || image.title || '')}" loading="lazy">
      <span>${escapeHtml(image.caption || '点击图片放大')}</span>
    </a>
    ${links ? `<div class="disclosure-links">${links}</div>` : ''}
  </details>`;
}

function detailDisclosure(panel) {
  if (!panel?.rows?.length && !panel?.links?.length) return '';
  const rows = panel.rows?.length ? `<div class="disclosure-detail-rows">${detailRows(panel.rows)}</div>` : '';
  const links = (panel.links || []).map(link => `<a class="disclosure-resource-link" href="${escapeHtml(link.href)}" target="_blank" rel="noopener">${escapeHtml(link.label)}</a>`).join('');
  return `<details class="detail-disclosure">
    <summary><span>${escapeHtml(panel.title || '查看详情')}</span><span class="summary-toggle" aria-hidden="true"></span></summary>
    ${rows}
    ${links ? `<div class="disclosure-links">${links}</div>` : ''}
  </details>`;
}

function spotLinks(spots=[]) {
  return spots.map(spot => `<div class="spot-link-row">
    <strong>${escapeHtml(spot.name)}</strong>
    <div class="spot-link-actions">
      <a class="spot-icon-button map-spot-button" target="_blank" rel="noopener" href="${mapLink(spot.mapTarget)}" aria-label="在 Google 地图查看 ${escapeHtml(spot.name)}" title="Google 地图">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>
      </a>
      <a class="spot-icon-button xhs-spot-button" target="_blank" rel="noopener" href="${escapeHtml(spot.xhsLink)}" aria-label="在小红书查看 ${escapeHtml(spot.name)}" title="小红书">薯</a>
    </div>
  </div>`).join('');
}

function mapIconLink(name, destination) {
  return `<a class="spot-icon-button map-spot-button" target="_blank" rel="noopener" href="${mapLink(destination)}" aria-label="在 Google 地图查看 ${escapeHtml(name)}" title="Google 地图">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>
  </a>`;
}

function shoppingGuide(guide) {
  if (!guide?.image) return '';
  const shops = (guide.shops || []).map(shop => `<section class="guide-shop">
    <div class="guide-shop-heading"><h3>${escapeHtml(shop.name)}</h3>${mapIconLink(shop.name, shop.mapTarget)}</div>
    <div class="guide-shop-notes">${detailRows(shop.notes)}</div>
  </section>`).join('');
  return `<section class="shopping-guide" aria-label="银座购物攻略">
    <div class="guide-image-block">
      <a class="guide-image-link" href="${escapeHtml(guide.image)}" target="_blank" rel="noopener" aria-label="放大查看银座购物攻略地图">
        <img src="${escapeHtml(guide.image)}" alt="${escapeHtml(guide.alt || '银座购物攻略地图')}" loading="lazy">
      </a>
      <a class="spot-icon-button xhs-spot-button guide-xhs-button" target="_blank" rel="noopener" href="${escapeHtml(guide.xhsLink)}" aria-label="在小红书查看银座购物攻略" title="小红书">薯</a>
    </div>
    ${shops}
  </section>`;
}

function renderFoodBackups() {
  const container = $('#foodBackups');
  if (!container || !foodAlternatives.length) return;
  container.innerHTML = foodAlternatives.map(group => `<details class="food-area"${group.open ? ' open' : ''}>
    <summary>
      <span><strong>${escapeHtml(group.area)}</strong><small>${group.restaurants.length} 家</small></span>
      <span class="summary-toggle" aria-hidden="true"></span>
    </summary>
    <div class="food-area-content">
      <p class="food-area-note">${escapeHtml(group.note)}</p>
      <div class="food-list">${group.restaurants.map(restaurant => `<article class="food-option">
        <div class="food-option-heading">
          <h3>${escapeHtml(restaurant.name)}</h3>
          ${mapIconLink(restaurant.name, restaurant.mapTarget)}
        </div>
        <p>${escapeHtml(restaurant.reason)}</p>
      </article>`).join('')}</div>
    </div>
  </details>`).join('');
}

function renderDay(id) {
  const day = tripDays.find(item => item.id === id) || tripDays[0];
  activeDay = day.id;
  $('#dayDate').textContent = paddedDate(day.date);
  $('#dayWeekday').textContent = day.weekday;
  $('#dayTitle').textContent = day.title;
  $('#daySummary').textContent = day.summary;
  $('#dayBadge').textContent = day.badge;
  const note = $('#dayNote');
  note.hidden = !day.note;
  note.textContent = day.note || '';

  if (!day.nodes) {
    timeline.innerHTML = '<div class="empty-day">这一天的完整时间轴正在整理，样式与首日保持一致。</div>';
  } else {
    const cards = day.nodes.map(node => {
      if (node.collapsed) {
        return `<article class="timeline-card optional-timeline-card">
          <span class="timeline-dot" aria-hidden="true"></span>
          <details class="optional-card">
            <summary><h2>${escapeHtml(node.place)}</h2><span class="summary-toggle" aria-hidden="true"></span></summary>
            <div class="optional-card-content">
              <p class="transit">${escapeHtml(node.transit)}</p>
              <div class="spot-link-list">${spotLinks(node.spots)}</div>
            </div>
          </details>
        </article>`;
      }
      const navigationButton = node.mapTarget && !node.noNav
        ? `<a class="map-button" target="_blank" rel="noopener" aria-label="在 Google 地图查看 ${escapeHtml(node.place)}" href="${mapLink(node.mapTarget)}">导航</a>`
        : '';
      const bookingButton = node.privateLink ? `<a class="booking-button" target="_blank" rel="noopener" href="${escapeHtml(node.privateLink)}">管理预约</a>` : '';
      const externalButtons = (node.externalLinks || []).map(link => `<a class="resource-button" target="_blank" rel="noopener" href="${escapeHtml(link.href)}">${escapeHtml(link.label)}</a>`).join('');
      const visibleDetails = [...(node.details || []), ...(node.privateDetails || [])];
      const detailsPanel = visibleDetails.length ? `<div class="details-panel">${detailRows(visibleDetails)}</div>` : '';
      const collapsedDetails = detailDisclosure(node.collapsedDetails);
      const disclosure = imageDisclosure(node.collapsibleImage);
      const guide = shoppingGuide(node.shoppingGuide);
      const tickets = ticketGallery(node.ticketImages);
      return `<article class="timeline-card">
        <span class="timeline-dot" aria-hidden="true"></span>
        <div class="place-card">
          <div class="place-main">
            <div class="event-line">
              <time class="timeline-time">${escapeHtml(node.time)}</time>
              <span class="place-meta"><span class="mode-icon">${node.mode}</span><span>${escapeHtml(node.modeText)}</span></span>
            </div>
            <h2>${escapeHtml(node.place)}</h2>
            <p class="transit">${escapeHtml(node.transit)}</p>
            ${detailsPanel}
            ${collapsedDetails}
            ${disclosure}
            ${guide}
            ${tickets}
            ${navigationButton || bookingButton || externalButtons ? `<div class="card-actions">${externalButtons}${bookingButton}${navigationButton}</div>` : ''}
          </div>
        </div>
      </article>`;
    }).join('');
    timeline.innerHTML = cards;
  }
  renderNav();
  document.querySelector(`[data-day="${day.id}"]`)?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

nav.addEventListener('click', event => {
  const tab = event.target.closest('[data-day]');
  if (!tab) return;
  renderDay(tab.dataset.day);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('#todayButton').addEventListener('click', () => {
  const japan = japanDayId();
  renderDay(tripDays.some(day => day.id === japan) ? japan : tripDays[0].id);
});

$('#offlineHelpButton').addEventListener('click', () => {
  const isApple = /iPhone|iPad|Mac/.test(navigator.userAgent);
  showToast(isApple ? 'iPhone：用 Safari 打开，点“分享”→“添加到主屏幕”' : '打开浏览器菜单，选择“安装应用”或“添加到主屏幕”');
});

function showToast(message) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

addEventListener('beforeinstallprompt', event => {
  event.preventDefault(); installPrompt = event; $('#installButton').hidden = false;
});
$('#installButton').addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; $('#installButton').hidden = true;
});

renderFoodBackups();
renderDay(activeDay);
</script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.unregister()));
        caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
      } else {
        addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
      }
    }
  </script>
</body>
</html>
