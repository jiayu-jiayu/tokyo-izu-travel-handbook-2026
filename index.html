  <style>:root {
  --ink: #1f2329;
  --ink-soft: #5e6266;
  --teal: #0052d9;
  --teal-deep: #003d99;
  --teal-pale: #e8f3ff;
  --coral: #0052d9;
  --paper: #f8f9fa;
  --surface: #ffffff;
  --mist: #f5f9ff;
  --line: #cfe4ff;
  --shadow: 0 2px 8px rgba(0, 0, 0, .08);
  --radius: 18px;
  font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--paper); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }

.skip-link { position: fixed; left: 1rem; top: -5rem; z-index: 100; background: var(--ink); color: white; padding: .75rem 1rem; border-radius: 10px; }
.skip-link:focus { top: 1rem; }

.topbar {
  min-height: 66px;
  padding: max(.7rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) .65rem max(1rem, env(safe-area-inset-left));
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255, 255, 255, .94); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.trip-mark { display: flex; align-items: center; gap: .65rem; }
.trip-mark b { display: block; font-size: 1.02rem; font-weight: 600; letter-spacing: .01em; }
.trip-mark small { display: block; margin-top: .08rem; color: var(--ink-soft); letter-spacing: .06em; font-size: .7rem; }
.trip-stamp {
  display: grid; place-items: center; width: 34px; aspect-ratio: 1;
  border: 0; color: white; background: var(--teal-deep); border-radius: 11px;
  font-family: inherit; font-weight: 600; transform: none;
}
.icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); }
.icon-button svg { width: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.date-ribbon {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow); backdrop-filter: blur(16px);
}
.date-scroll {
  display: flex; gap: .35rem; overflow-x: auto; overscroll-behavior-inline: contain;
  scrollbar-width: none; padding: .55rem max(.75rem, env(safe-area-inset-right)) .55rem max(.75rem, env(safe-area-inset-left));
}
.date-scroll::-webkit-scrollbar { display: none; }
.date-tab {
  flex: 0 0 auto; min-width: 66px; min-height: 52px;
  border: 0; border-radius: 14px; padding: .3rem .65rem;
  background: transparent; color: var(--ink-soft); text-align: center; cursor: pointer;
}
.date-tab span { display: block; font-size: .75rem; }
.date-tab b { display: block; margin-top: .08rem; font-size: .98rem; font-weight: 600; }
.date-tab[aria-selected="true"] { background: var(--teal); color: white; }
.date-tab:focus-visible { outline: 3px solid rgba(228,111,85,.4); outline-offset: 2px; }

.page-shell { width: min(760px, 100%); margin: 0 auto; padding: 1.4rem 1rem calc(5rem + env(safe-area-inset-bottom)); }
.day-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: .85rem; margin: .2rem 0 1.45rem; }
.eyebrow { color: var(--teal-deep); font-weight: 600; font-size: .78rem; letter-spacing: .04em; }
.day-heading h1 { margin: .3rem 0 .35rem; font-size: clamp(1.75rem, 7vw, 2.5rem); font-weight: 600; line-height: 1.2; letter-spacing: 0; }
.day-heading p { margin: 0; color: var(--ink-soft); font-size: .94rem; line-height: 1.6; }
.weather-note { flex: 0 0 auto; margin-top: .2rem; padding: .3rem .55rem; color: var(--teal-deep); background: var(--teal-pale); border: 1px solid var(--line); border-radius: 999px; font-size: .72rem; font-weight: 600; transform: none; }

.timeline { position: relative; }
.timeline::before { content: ""; position: absolute; left: 64px; top: 12px; bottom: 16px; width: 1px; background: var(--line); }
.timeline-card { position: relative; display: grid; grid-template-columns: 50px 1fr; gap: 1.65rem; margin-bottom: .9rem; }
.timeline-time { padding-top: 1.15rem; font-size: .8rem; font-weight: 600; color: var(--coral); text-align: right; line-height: 1.15; }
.timeline-time::after { content: ""; position: absolute; left: 59px; top: 1.28rem; width: 10px; height: 10px; background: var(--paper); border: 2px solid var(--coral); border-radius: 50%; }
.place-card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.place-main { padding: 1rem 1rem .95rem; }
.place-meta { display: flex; align-items: center; gap: .45rem; color: var(--ink-soft); font-size: .77rem; }
.mode-icon { width: 1.45rem; height: 1.45rem; display: grid; place-items: center; background: var(--teal-pale); border-radius: 50%; font-size: .78rem; }
.place-main h2 { margin: .38rem 0 .4rem; font-size: 1.16rem; font-weight: 600; line-height: 1.4; letter-spacing: 0; }
.transit { margin: 0; color: var(--ink-soft); font-size: .89rem; line-height: 1.55; }
.card-actions { display: flex; justify-content: flex-end; gap: .45rem; margin-top: .7rem; }
.map-button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--teal); border-radius: 999px; padding: .4rem .78rem; background: var(--teal-pale); color: var(--teal-deep); font-size: .78rem; font-weight: 600; line-height: 1; text-decoration: none; }
.booking-button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 999px; padding: .4rem .78rem; background: var(--surface); color: var(--ink); font-size: .78rem; font-weight: 600; line-height: 1; text-decoration: none; }
.details-panel { margin-top: .75rem; padding: .55rem .72rem; border: 1px solid var(--line); border-radius: 12px; background: var(--mist); }
.detail-row { display: grid; grid-template-columns: 3.6rem 1fr; gap: .55rem; padding: .38rem 0; font-size: .82rem; line-height: 1.5; }
.detail-row + .detail-row { border-top: 1px solid rgba(207, 228, 255, .8); }
.detail-row b { color: var(--teal); font-size: .74rem; font-weight: 600; letter-spacing: .01em; }
.detail-row span { color: var(--ink-soft); }
.ticket-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; margin-top: .75rem; }
.ticket-gallery a { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--teal-deep); text-decoration: none; }
.ticket-gallery img { display: block; width: 100%; aspect-ratio: .48; object-fit: contain; background: white; }
.ticket-gallery span { display: block; padding: .5rem .4rem; border-top: 1px solid var(--line); font-size: .72rem; font-weight: 600; text-align: center; }

.day-note { margin: 1.4rem 0; border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 14px; padding: .9rem 1rem; background: var(--surface); box-shadow: var(--shadow); font-size: .87rem; line-height: 1.65; color: var(--ink-soft); }
.utility-strip { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.text-button { min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: .65rem .8rem; font: inherit; font-size: .83rem; text-decoration: none; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom)); z-index: 60; max-width: calc(100% - 2rem); transform: translate(-50%, 140%); transition: transform .25s ease; background: var(--ink); color: white; border-radius: 12px; padding: .72rem 1rem; box-shadow: var(--shadow); font-size: .84rem; }
.toast.show { transform: translate(-50%, 0); }

@media (min-width: 720px) {
  .topbar { padding-inline: 1.5rem; }
  .date-scroll { justify-content: center; }
  .page-shell { padding-top: 2rem; }
  .timeline-card { grid-template-columns: 64px 1fr; gap: 1.8rem; }
  .timeline::before { left: 80px; }
  .timeline-time::after { left: 75px; }
}
@media (max-width: 390px) {
  .ticket-gallery { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>

  <script>const tripDays = window.tripDays;

const $ = (selector) => document.querySelector(selector);
const nav = $('#dateNav');
const timeline = $('#timeline');
function japanDayId() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  return `${parts.find(part => part.type === 'month').value}-${parts.find(part => part.type === 'day').value}`;
}
let activeDay = tripDays.some(day => day.id === japanDayId()) ? japanDayId() : tripDays[0].id;
let installPrompt;

function escapeHtml(value='') {
  return value.replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function mapLink(destination) {
  const p = new URLSearchParams({ api: '1', query: destination });
  return `https://www.google.com/maps/search/?${p}`;
}

function renderNav() {
  nav.innerHTML = tripDays.map(day => `
    <button class="date-tab" type="button" role="tab" aria-selected="${day.id === activeDay}" data-day="${day.id}">
      <span>${day.weekday}</span><b>${day.date}</b>
    </button>`).join('');
}

function detailRows(rows=[]) {
  return rows.map(([label, text]) => `<div class="detail-row"><b>${escapeHtml(label)}</b><span>${escapeHtml(text)}</span></div>`).join('');
}

function ticketGallery(images=[]) {
  if (!images.length) return '';
  return `<div class="ticket-gallery" aria-label="SHIBUYA SKY 电子票">${images.map((src, index) => `
    <a href="${escapeHtml(src)}" target="_blank" rel="noopener" aria-label="放大查看电子票 ${index + 1}">
      <img src="${escapeHtml(src)}" alt="SHIBUYA SKY 电子票 ${index + 1}" loading="lazy">
      <span>电子票 ${index + 1} · 点击放大</span>
    </a>`).join('')}</div>`;
}

function renderDay(id) {
  const day = tripDays.find(item => item.id === id) || tripDays[0];
  activeDay = day.id;
  $('#dayEyebrow').textContent = `${day.date} ${day.weekday} · ${day.label}`;
  $('#dayTitle').textContent = day.title;
  $('#daySummary').textContent = day.summary;
  $('#dayBadge').textContent = day.badge;
  const note = $('#dayNote');
  note.hidden = !day.note;
  note.textContent = day.note || '';

  if (!day.nodes) {
    timeline.innerHTML = '<div class="empty-day">这一天的完整时间轴正在整理，样式与首日保持一致。</div>';
  } else {
    const cards = day.nodes.map(node => {
      const navigationButton = node.noNav ? '' : `<a class="map-button" target="_blank" rel="noopener" href="${mapLink(node.mapTarget || node.place)}">导航</a>`;
      const bookingButton = node.privateLink ? `<a class="booking-button" target="_blank" rel="noopener" href="${escapeHtml(node.privateLink)}">管理预约</a>` : '';
      const visibleDetails = [...(node.details || []), ...(node.privateDetails || [])];
      const detailsPanel = visibleDetails.length ? `<div class="details-panel">${detailRows(visibleDetails)}</div>` : '';
      const tickets = ticketGallery(node.ticketImages);
      return `<article class="timeline-card">
        <time class="timeline-time">${escapeHtml(node.time)}</time>
        <div class="place-card">
          <div class="place-main">
            <div class="place-meta"><span class="mode-icon">${node.mode}</span><span>${escapeHtml(node.modeText)}</span></div>
            <h2>${escapeHtml(node.place)}</h2>
            <p class="transit">${escapeHtml(node.transit)}</p>
            ${detailsPanel}
            ${tickets}
            ${navigationButton || bookingButton ? `<div class="card-actions">${bookingButton}${navigationButton}</div>` : ''}
          </div>
        </div>
      </article>`;
    }).join('');
    timeline.innerHTML = cards;
  }
  renderNav();
  document.querySelector(`[data-day="${day.id}"]`)?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

nav.addEventListener('click', event => {
  const tab = event.target.closest('[data-day]');
  if (!tab) return;
  renderDay(tab.dataset.day);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('#todayButton').addEventListener('click', () => {
  const japan = japanDayId();
  renderDay(tripDays.some(day => day.id === japan) ? japan : tripDays[0].id);
});

$('#offlineHelpButton').addEventListener('click', () => {
  const isApple = /iPhone|iPad|Mac/.test(navigator.userAgent);
  showToast(isApple ? 'iPhone：用 Safari 打开，点“分享”→“添加到主屏幕”' : '打开浏览器菜单，选择“安装应用”或“添加到主屏幕”');
});

function showToast(message) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 3000);
}

addEventListener('beforeinstallprompt', event => {
  event.preventDefault(); installPrompt = event; $('#installButton').hidden = false;
});
$('#installButton').addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; $('#installButton').hidden = true;
});
